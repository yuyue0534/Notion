<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工位预订管理系统 Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #dfe5ef;
      --text: #25324a;
      --muted: #6b778c;
      --available-bg: #dff3e7;
      --available-text: #146c43;
      --booked-bg: #fde2e2;
      --booked-text: #a61e2d;
      --fixed-bg: #e9edf3;
      --fixed-text: #495057;
      --primary-soft: rgba(13, 110, 253, 0.16);
      --corridor-bg: #f7f9fc;
      --corridor-line: #c9d4e5;
      --seat-width: 86px;
      --seat-height: 76px;
      --seat-gap: 10px;
      --block-padding: 16px;
      --corridor-size: 88px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .page-shell {
      min-height: 100vh;
      padding: 22px;
    }

    .main-card,
    .side-card {
      border: 0;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 30px rgba(32, 47, 74, 0.08);
    }

    .page-title {
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .subtle-text {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #495057;
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .legend-box {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: inline-block;
    }

    .summary-strip {
      border-radius: 14px;
      background: #f7faff;
      border: 1px solid #d9e7ff;
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    .floor-scroll {
      width: 100%;
      height: calc(100vh - 250px);
      min-height: 620px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.9), rgba(249,251,255,0.95));
      padding: 20px;
    }

    .floor-map {
      display: grid;
      grid-template-columns:
        max-content
        var(--corridor-size)
        max-content
        var(--corridor-size)
        max-content;
      grid-template-rows:
        max-content
        var(--corridor-size)
        max-content
        var(--corridor-size)
        max-content;
      gap: 14px;
      align-items: start;
      width: max-content;
      min-width: max-content;
      margin: 0 auto;
    }

    .seat-block {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: var(--block-padding);
      box-shadow: 0 8px 20px rgba(38, 57, 90, 0.05);
      width: max-content;
    }

    .block-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .block-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .block-meta {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .block-badge {
      background: #eef4ff;
      color: #2759c7;
      border: 1px solid #cddcff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(5, var(--seat-width));
      grid-auto-rows: var(--seat-height);
      gap: var(--seat-gap);
      width: max-content;
    }

    .seat {
      width: var(--seat-width);
      height: var(--seat-height);
      border-radius: 12px;
      border: 2px solid transparent;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }

    .seat:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(27, 48, 80, 0.14);
    }

    .seat.fixed {
      background: var(--fixed-bg);
      color: var(--fixed-text);
      cursor: not-allowed;
    }

    .seat.available {
      background: var(--available-bg);
      color: var(--available-text);
    }

    .seat.booked {
      background: var(--booked-bg);
      color: var(--booked-text);
    }

    .seat.selected {
      border-color: #0d6efd;
      box-shadow: 0 0 0 5px var(--primary-soft);
      transform: translateY(-2px);
    }

    .seat-id {
      font-weight: 800;
      font-size: 0.92rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .seat-status {
      margin-top: 2px;
      font-size: 0.76rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .seat-user {
      margin-top: 2px;
      font-size: 0.7rem;
      line-height: 1.15;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.92;
    }

    .corridor {
      position: relative;
      border-radius: 18px;
      background:
        repeating-linear-gradient(
          135deg,
          rgba(184, 197, 218, 0.18) 0px,
          rgba(184, 197, 218, 0.18) 12px,
          rgba(255, 255, 255, 0.52) 12px,
          rgba(255, 255, 255, 0.52) 24px
        ),
        var(--corridor-bg);
      border: 1px dashed var(--corridor-line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a879b;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      overflow: hidden;
    }

    .corridor.vertical {
      min-width: var(--corridor-size);
      min-height: 100%;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .corridor.horizontal {
      min-height: var(--corridor-size);
      width: 100%;
    }

    .corridor.cross {
      min-width: var(--corridor-size);
      min-height: var(--corridor-size);
      writing-mode: initial;
    }

    .sidebar-sticky {
      position: sticky;
      top: 22px;
    }

    .side-card .card-body {
      padding: 18px;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .seat-info-empty {
      color: var(--muted);
      background: #fafbfd;
      border: 1px dashed #d7deea;
      border-radius: 14px;
      padding: 16px;
      line-height: 1.8;
    }

    .info-row {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px dashed #e8edf4;
      font-size: 0.94rem;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-key {
      color: var(--muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .status-available {
      background: #e8f7ee;
      color: #157347;
    }

    .status-booked {
      background: #fff0f0;
      color: #b02a37;
    }

    .status-fixed {
      background: #eef1f5;
      color: #495057;
    }

    .form-label {
      font-weight: 700;
      color: #344054;
      font-size: 0.92rem;
    }

    .btn {
      border-radius: 12px;
    }

    .note-box {
      border-radius: 14px;
      background: #f8fbff;
      border: 1px solid #dbe7f7;
      color: #5f6b7e;
      padding: 12px;
      font-size: 0.88rem;
      line-height: 1.7;
    }

    .mini-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px dashed #e7edf5;
      font-size: 0.92rem;
    }

    .mini-stat:last-child {
      border-bottom: 0;
    }

    .mini-stat strong {
      font-size: 1rem;
    }

    .invalid-hint {
      font-size: 0.86rem;
      color: #b02a37;
      margin-top: 8px;
      display: none;
    }

    @media (max-width: 1199px) {
      .floor-scroll {
        height: 720px;
      }

      .sidebar-sticky {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .page-shell {
        padding: 12px;
      }

      .floor-scroll {
        min-height: 560px;
        height: 620px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>

<div class="container-fluid page-shell">
  <div class="row g-4">
    <div class="col-xl-9">
      <div class="card main-card">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
            <div>
              <h2 class="page-title">🏢 工位预订管理系统</h2>
              <div class="subtle-text">简洁演示版：左侧井字格工位图，右侧查看与预订。</div>
            </div>

            <div class="d-flex flex-wrap gap-3">
              <div class="legend-item">
                <span class="legend-box" style="background:#dff3e7;"></span>可预订
              </div>
              <div class="legend-item">
                <span class="legend-box" style="background:#fde2e2;"></span>已预订
              </div>
              <div class="legend-item">
                <span class="legend-box" style="background:#e9edf3;"></span>固定工位
              </div>
            </div>
          </div>

          <div class="summary-strip d-flex justify-content-between flex-wrap gap-2 mb-4">
            <div id="floorSummary">当前楼层：总部办公层</div>
            <div class="text-primary fw-bold">布局：3 × 3 工位区块 + 横纵主走道</div>
          </div>

          <div class="floor-scroll">
            <div id="floorMap" class="floor-map"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-3">
      <div class="sidebar-sticky">

        <div class="card side-card mb-3">
          <div class="card-body">
            <div class="panel-title">📋 工位信息</div>
            <div id="seatInfo" class="seat-info-empty">
              点击左侧任意工位，这里展示工位编号、所属区域、当前状态与预订详情。
            </div>
          </div>
        </div>

        <div class="card side-card mb-3">
          <div class="card-body">
            <div class="panel-title">📝 预订设置</div>

            <form id="bookingForm">
              <div class="mb-3">
                <label class="form-label">工位编号</label>
                <input type="text" class="form-control" id="seatNumber" readonly placeholder="请先选择工位">
              </div>

              <div class="mb-3">
                <label class="form-label">预订人</label>
                <input type="text" class="form-control" id="bookerName" placeholder="请输入姓名">
              </div>

              <div class="mb-3">
                <label class="form-label">开始时间</label>
                <input type="datetime-local" class="form-control" id="startTime">
              </div>

              <div class="mb-3">
                <label class="form-label">结束时间</label>
                <input type="datetime-local" class="form-control" id="endTime">
                <div id="timeError" class="invalid-hint">结束时间必须晚于开始时间。</div>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-2" id="submitBookingBtn">
                提交预订
              </button>

              <button type="button" class="btn btn-outline-danger w-100" id="cancelBookingBtn">
                取消预订
              </button>
            </form>

            <div class="note-box mt-3">
              演示规则：固定工位不可预订；已预订工位需要先取消，再重新设置。
            </div>
          </div>
        </div>

        <div class="card side-card">
          <div class="card-body">
            <div class="panel-title">⚙️ 系统操作</div>

            <div class="mb-3" id="statsPanel"></div>

            <button class="btn btn-outline-success w-100 mb-2" id="mockBtn">
              生成模拟预订数据
            </button>

            <button class="btn btn-outline-secondary w-100" id="resetBtn">
              重置所有预订数据
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'seat_booking_demo_grid_v2';
  const BLOCK_ROWS = 3;
  const BLOCK_COLS = 3;
  const SEATS_PER_BLOCK = 25;
  const FIXED_SEATS = 60;

  const blockNames = [
    ['西北工位区', '北侧中区', '东北工位区'],
    ['西侧中区', '中央协作区', '东侧中区'],
    ['西南工位区', '南侧中区', '东南工位区']
  ];

  const floorMap = document.getElementById('floorMap');
  const floorSummary = document.getElementById('floorSummary');
  const seatInfo = document.getElementById('seatInfo');
  const bookingForm = document.getElementById('bookingForm');
  const seatNumber = document.getElementById('seatNumber');
  const bookerName = document.getElementById('bookerName');
  const startTime = document.getElementById('startTime');
  const endTime = document.getElementById('endTime');
  const timeError = document.getElementById('timeError');
  const submitBookingBtn = document.getElementById('submitBookingBtn');
  const cancelBookingBtn = document.getElementById('cancelBookingBtn');
  const statsPanel = document.getElementById('statsPanel');

  let selectedSeatId = null;

  function pad(num, len = 3) {
    return String(num).padStart(len, '0');
  }

  function toDatetimeLocalValue(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    const h = String(date.getHours()).padStart(2, '0');
    const min = String(date.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${d}T${h}:${min}`;
  }

  function setDefaultTimes() {
    const now = new Date();
    now.setMinutes(0, 0, 0);
    now.setHours(now.getHours() + 1);

    const end = new Date(now.getTime() + 4 * 60 * 60 * 1000);
    startTime.value = toDatetimeLocalValue(now);
    endTime.value = toDatetimeLocalValue(end);
  }

  function generateInitialSeats() {
    const seats = [];
    let seatId = 1;

    for (let row = 0; row < BLOCK_ROWS; row++) {
      for (let col = 0; col < BLOCK_COLS; col++) {
        const blockCode = `${String.fromCharCode(65 + row)}${col + 1}`;

        for (let localIndex = 1; localIndex <= SEATS_PER_BLOCK; localIndex++) {
          const isFixed = seatId <= FIXED_SEATS;
          seats.push({
            id: seatId,
            code: `A-${pad(seatId)}`,
            blockCode,
            blockName: blockNames[row][col],
            blockRow: row,
            blockCol: col,
            localIndex,
            type: isFixed ? 'fixed' : 'flexible',
            fixedOwner: isFixed ? `固定员工${seatId}` : '',
            booking: null
          });
          seatId += 1;
        }
      }
    }

    return seats;
  }

  function getSeats() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      return JSON.parse(data);
    }

    const initial = generateInitialSeats();
    saveSeats(initial);
    return initial;
  }

  function saveSeats(seats) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
  }

  function getSeatStatus(seat) {
    if (seat.type === 'fixed') return 'fixed';
    if (seat.booking) return 'booked';
    return 'available';
  }

  function getStatusText(seat) {
    const status = getSeatStatus(seat);
    if (status === 'fixed') return '固定工位';
    if (status === 'booked') return '已预订';
    return '可预订';
  }

  function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString('zh-CN', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
  }

  function buildSeatBlock(row, col, seats) {
    const blockSeats = seats.filter(
      seat => seat.blockRow === row && seat.blockCol === col
    );

    const availableCount = blockSeats.filter(seat => getSeatStatus(seat) === 'available').length;
    const bookedCount = blockSeats.filter(seat => getSeatStatus(seat) === 'booked').length;
    const fixedCount = blockSeats.filter(seat => getSeatStatus(seat) === 'fixed').length;

    const block = document.createElement('div');
    block.className = 'seat-block';
    block.innerHTML = `
      <div class="block-head">
        <div>
          <div class="block-title">${blockNames[row][col]}</div>
          <div class="block-meta">区块 ${String.fromCharCode(65 + row)}${col + 1} · 共 ${blockSeats.length} 席</div>
        </div>
        <div class="block-badge">空 ${availableCount} / 订 ${bookedCount} / 固 ${fixedCount}</div>
      </div>
      <div class="seat-grid"></div>
    `;

    const seatGrid = block.querySelector('.seat-grid');

    blockSeats.forEach(seat => {
      const statusClass = getSeatStatus(seat);
      const seatDiv = document.createElement('div');
      seatDiv.className = `seat ${statusClass}`;

      if (selectedSeatId === seat.id) {
        seatDiv.classList.add('selected');
      }

      seatDiv.innerHTML = `
        <div class="seat-id">${seat.code}</div>
        <div class="seat-status">${getStatusText(seat)}</div>
        <div class="seat-user">
          ${seat.type === 'fixed'
            ? seat.fixedOwner
            : seat.booking
              ? seat.booking.name
              : '开放预订'}
        </div>
      `;

      seatDiv.addEventListener('click', () => selectSeat(seat.id));
      seatGrid.appendChild(seatDiv);
    });

    return block;
  }

  function createCorridor(className, label) {
    const corridor = document.createElement('div');
    corridor.className = `corridor ${className}`;
    corridor.textContent = label;
    return corridor;
  }

  function renderFloorMap() {
    const seats = getSeats();
    floorMap.innerHTML = '';

    for (let gridRow = 0; gridRow < 5; gridRow++) {
      for (let gridCol = 0; gridCol < 5; gridCol++) {
        const isBlockRow = gridRow % 2 === 0;
        const isBlockCol = gridCol % 2 === 0;

        if (isBlockRow && isBlockCol) {
          const blockRow = gridRow / 2;
          const blockCol = gridCol / 2;
          floorMap.appendChild(buildSeatBlock(blockRow, blockCol, seats));
        } else if (!isBlockRow && !isBlockCol) {
          floorMap.appendChild(createCorridor('cross', '交汇口'));
        } else if (!isBlockRow && isBlockCol) {
          floorMap.appendChild(createCorridor('horizontal', '横向走道'));
        } else {
          floorMap.appendChild(createCorridor('vertical', '纵向走道'));
        }
      }
    }
  }

  function renderSummary() {
    const seats = getSeats();
    const total = seats.length;
    const fixed = seats.filter(seat => seat.type === 'fixed').length;
    const booked = seats.filter(seat => getSeatStatus(seat) === 'booked').length;
    const available = seats.filter(seat => getSeatStatus(seat) === 'available').length;

    floorSummary.innerHTML = `
      当前楼层：总部办公层 ｜ 共 <strong>${total}</strong> 个工位 ｜ 固定工位 <strong>${fixed}</strong> 个 ｜ 已预订 <strong>${booked}</strong> 个 ｜ 可预订 <strong>${available}</strong> 个
    `;

    statsPanel.innerHTML = `
      <div class="mini-stat"><span>工位总数</span><strong>${total}</strong></div>
      <div class="mini-stat"><span>固定工位</span><strong>${fixed}</strong></div>
      <div class="mini-stat"><span>当前已订</span><strong>${booked}</strong></div>
      <div class="mini-stat"><span>当前空闲</span><strong>${available}</strong></div>
    `;
  }

  function renderSeatInfo(seat) {
    if (!seat) {
      seatInfo.className = 'seat-info-empty';
      seatInfo.innerHTML = '点击左侧任意工位，这里展示工位编号、所属区域、当前状态与预订详情。';
      return;
    }

    seatInfo.className = '';
    const status = getSeatStatus(seat);
    const statusLabel =
      status === 'available'
        ? '<span class="status-pill status-available">可预订</span>'
        : status === 'booked'
          ? '<span class="status-pill status-booked">已预订</span>'
          : '<span class="status-pill status-fixed">固定工位</span>';

    seatInfo.innerHTML = `
      <div class="info-row">
        <div class="info-key">工位编号</div>
        <div><strong>${seat.code}</strong></div>
      </div>
      <div class="info-row">
        <div class="info-key">所属区块</div>
        <div>${seat.blockName}（${seat.blockCode}）</div>
      </div>
      <div class="info-row">
        <div class="info-key">当前状态</div>
        <div>${statusLabel}</div>
      </div>
      <div class="info-row">
        <div class="info-key">工位类型</div>
        <div>${seat.type === 'fixed' ? '固定人员工位' : '开放预订工位'}</div>
      </div>
      ${
        seat.type === 'fixed'
          ? `
            <div class="info-row">
              <div class="info-key">固定使用人</div>
              <div>${seat.fixedOwner}</div>
            </div>
          `
          : ''
      }
      ${
        seat.booking
          ? `
            <div class="info-row">
              <div class="info-key">预订人</div>
              <div>${seat.booking.name}</div>
            </div>
            <div class="info-row">
              <div class="info-key">开始时间</div>
              <div>${formatDate(seat.booking.start)}</div>
            </div>
            <div class="info-row">
              <div class="info-key">结束时间</div>
              <div>${formatDate(seat.booking.end)}</div>
            </div>
          `
          : ''
      }
    `;
  }

  function refreshFormState(seat) {
    const disabledSubmit = !seat || seat.type === 'fixed' || !!seat.booking;
    const disabledCancel = !seat || seat.type === 'fixed' || !seat.booking;

    submitBookingBtn.disabled = disabledSubmit;
    cancelBookingBtn.disabled = disabledCancel;
    bookerName.disabled = disabledSubmit;
    startTime.disabled = disabledSubmit;
    endTime.disabled = disabledSubmit;
  }

  function selectSeat(id) {
    const seats = getSeats();
    const seat = seats.find(item => item.id === id);

    selectedSeatId = id;
    seatNumber.value = seat.code;

    if (!seat.booking && seat.type === 'flexible') {
      bookerName.value = '';
      setDefaultTimes();
    }

    renderSeatInfo(seat);
    refreshFormState(seat);
    renderFloorMap();
  }

  function validateBookingTimes() {
    const start = startTime.value;
    const end = endTime.value;

    if (!start || !end) {
      timeError.style.display = 'none';
      return false;
    }

    const valid = new Date(start) < new Date(end);
    timeError.style.display = valid ? 'none' : 'block';
    return valid;
  }

  bookingForm.addEventListener('submit', event => {
    event.preventDefault();

    if (!selectedSeatId) {
      alert('请先选择一个工位。');
      return;
    }

    const seats = getSeats();
    const seat = seats.find(item => item.id === selectedSeatId);

    if (!seat || seat.type === 'fixed') {
      alert('固定工位不可预订。');
      return;
    }

    if (seat.booking) {
      alert('当前工位已预订，请先取消已有预订。');
      return;
    }

    const name = bookerName.value.trim();
    const start = startTime.value;
    const end = endTime.value;

    if (!name || !start || !end) {
      alert('请完整填写预订信息。');
      return;
    }

    if (!validateBookingTimes()) {
      alert('结束时间必须晚于开始时间。');
      return;
    }

    seat.booking = { name, start, end };
    saveSeats(seats);

    renderSummary();
    renderFloorMap();
    renderSeatInfo(seat);
    refreshFormState(seat);

    alert(`${seat.code} 预订成功。`);
  });

  cancelBookingBtn.addEventListener('click', () => {
    if (!selectedSeatId) {
      alert('请先选择一个工位。');
      return;
    }

    const seats = getSeats();
    const seat = seats.find(item => item.id === selectedSeatId);

    if (!seat || !seat.booking) {
      alert('当前工位没有可取消的预订。');
      return;
    }

    if (!confirm(`确认取消 ${seat.code} 的预订吗？`)) {
      return;
    }

    seat.booking = null;
    saveSeats(seats);

    renderSummary();
    renderFloorMap();
    renderSeatInfo(seat);
    refreshFormState(seat);
    setDefaultTimes();

    alert('预订已取消。');
  });

  document.getElementById('mockBtn').addEventListener('click', () => {
    const seats = getSeats();
    const names = ['张伟', '李敏', '王强', '陈涛', '赵雪', '刘洋', '黄杰', '周琳', '吴凯', '徐峰'];
    const flexibleSeats = seats.filter(seat => seat.type === 'flexible');

    flexibleSeats.forEach(seat => {
      if (Math.random() < 0.22) {
        const start = new Date();
        start.setHours(9 + Math.floor(Math.random() * 4), 0, 0, 0);
        const end = new Date(start.getTime() + (2 + Math.floor(Math.random() * 5)) * 60 * 60 * 1000);

        seat.booking = {
          name: names[Math.floor(Math.random() * names.length)],
          start: toDatetimeLocalValue(start),
          end: toDatetimeLocalValue(end)
        };
      }
    });

    saveSeats(seats);
    renderSummary();
    renderFloorMap();

    if (selectedSeatId) {
      const selectedSeat = seats.find(item => item.id === selectedSeatId);
      renderSeatInfo(selectedSeat);
      refreshFormState(selectedSeat);
    }

    alert('已生成模拟预订数据。');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('确认重置所有预订数据吗？')) {
      return;
    }

    localStorage.removeItem(STORAGE_KEY);
    selectedSeatId = null;
    seatNumber.value = '';
    bookerName.value = '';
    setDefaultTimes();
    renderSummary();
    renderFloorMap();
    renderSeatInfo(null);
    refreshFormState(null);

    alert('数据已重置。');
  });

  startTime.addEventListener('change', validateBookingTimes);
  endTime.addEventListener('change', validateBookingTimes);

  setDefaultTimes();
  renderSummary();
  renderFloorMap();
  renderSeatInfo(null);
  refreshFormState(null);
</script>

</body>
</html>
